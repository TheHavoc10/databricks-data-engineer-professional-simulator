name: Publicar Databricks Professional Campus

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'content.js'
      - 'favicon.svg'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar y validar web estática
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          for file in index.html styles.css app.js content.js favicon.svg; do
            test -s "$file" || { echo "::error::Falta el archivo $file"; exit 1; }
            cp "$file" _site/
          done
          touch _site/.nojekyll
          python - <<'PY'
          from pathlib import Path
          page=Path("_site/index.html").read_text(encoding="utf-8")
          assert '<html' in page.lower()
          assert 'content.js' in page and 'app.js' in page and 'styles.css' in page
          print("Archivos del campus listos para publicación.")
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar web
        id: deployment
        uses: actions/deploy-pages@v4
